name: CI - Train and Evaluate Model

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  train-evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: make install

      - name: Format Python files
        run: make format

      - name: Train model
        run: make train

      - name: Set up CML
        uses: iterative/setup-cml@v2

      - name: Evaluate model
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make eval

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-results
          path: |
            Results/
            Model/
            report.md
